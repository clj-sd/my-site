<script>
(function(){
    if(!WebData.isReady()){ WebData.onReady(render); return; }
    render();
    function render(){
        var D = SiteLoader.WebData, d = D.get('qg.dynamic');
        if(!d) return;
        document.getElementById('qdTitle').textContent = d.title || '新闻动态';
        document.title = (d.title||'新闻动态') + ' — 中经企管 | 企业新闻 · 行业动态';
        var cn = d.companyNews || [], cnH = '';
        cn.forEach(function(n){ cnH += '<div class="news-card"><span class="news-date">'+n.date+'</span><div><div class="news-title">'+n.title+'</div><div class="news-summary">'+n.summary+'</div></div></div>'; });
        document.getElementById('qdCompanyNews').innerHTML = cnH || '<p style="color:#889;text-align:center">暂无数据</p>';
        var inews = d.industryNews || [], inH = '';
        inews.forEach(function(n){ inH += '<div class="news-card"><span class="news-date">'+n.date+'</span><div><div class="news-title">'+n.title+'</div><div class="news-summary">'+n.summary+'</div></div></div>'; });
        document.getElementById('qdIndustryNews').innerHTML = inH || '<p style="color:#889;text-align:center">暂无数据</p>';
    }
})();
</script>
