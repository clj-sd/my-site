<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>中经集团 — 核技术医疗 · 企业综合服务</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="中经集团是国有资本控股的综合性产业集团，旗下拥有中经原子（BNCT精准医疗）和中经企管（企业综合服务），践行健康中国战略，助力高质量发展。" />
  <meta name="keywords" content="中经集团,中经原子,中经企管,BNCT,硼中子俘获治疗,精准医疗,核技术医疗,园区运营,资产管理,管理咨询,国企,国资控股" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://www.zj-group.com/" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231a2332'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-size='52' font-weight='800' fill='%23c9a962' font-family='serif'%3E中%3C/text%3E%3C/svg%3E" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="中经集团 — 核技术医疗 · 企业综合服务" />
  <meta property="og:description" content="国有资本控股综合性产业集团，聚焦核技术医疗与企业综合服务两大核心赛道。" />
  <meta property="og:url" content="https://www.zj-group.com/" />
  <meta property="og:site_name" content="中经集团" />
  <meta property="og:locale" content="zh_CN" />
  <meta property="og:image" content="https://www.zj-group.com/images/og-default.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "中经集团",
    "url": "https://www.zj-group.com/",
    "description": "国有资本控股的综合性产业集团，聚焦核技术医疗与企业综合服务",
    "subOrganization": [
      { "@type": "Organization", "name": "中经原子科技有限公司", "url": "https://www.zj-group.com/atom/" },
      { "@type": "Organization", "name": "中经企业管理有限公司", "url": "https://www.zj-group.com/qg/" }
    ]
  }
  </script>

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

  <link rel="stylesheet" href="css/style.css" />

  <style>
    /* 骨架屏加载动画 */
    .portal-loading {
      position: fixed; inset: 0; z-index: 9998;
      background: linear-gradient(165deg, #060D18 0%, #0F1928 30%, #152238 60%, #0F2640 100%);
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    .portal-loading.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .loading-inner { text-align: center; }
    .loading-spinner {
      width: 48px; height: 48px; margin: 0 auto 24px;
      border: 3px solid rgba(201,169,98,0.15);
      border-top-color: #c9a962;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: rgba(255,255,255,0.5); font-size: 14px; letter-spacing: 2px; }

    /* 卡片入场延迟 */
    .business-card { opacity: 0; animation: cardFadeIn 0.6s cubic-bezier(0.16,1,0.3,1) forwards; }
    .business-card:nth-child(1) { animation-delay: 0.1s; }
    .business-card:nth-child(2) { animation-delay: 0.25s; }
    @keyframes cardFadeIn {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<!-- 加载骨架屏 -->
<div class="portal-loading" id="portalLoading">
  <div class="loading-inner">
    <div class="loading-spinner"></div>
    <div class="loading-text">中经集团</div>
  </div>
</div>

<main class="portal-hero" id="portal" style="opacity:0;transition:opacity 0.5s ease">
  <div class="portal-content">
    <div class="portal-badge" id="portalBadge">中经集团</div>
    <h1 class="portal-title" id="heroTitle">科技赋能 · 服务赋能</h1>
    <p class="portal-subtitle" id="heroSubtitle">
      中经集团是国有资本控股的综合性产业集团，聚焦核技术医疗与企业综合服务两大核心赛道，践行健康中国战略，助力高质量发展。
    </p>
    <div class="business-cards" id="subsidiaryCards">
      <!-- JS 动态填充 -->
    </div>
  </div>
</main>

<script src="js/data-loader.js" data-root="./"></script>
<script src="js/site-loader.js"></script>
<script src="js/site-base.js"></script>
<script>
(function(){
  var loadingEl = document.getElementById('portalLoading');
  var portalEl = document.getElementById('portal');

  if(!WebData.isReady()){ WebData.onReady(render); return; }
  render();

  function render(){
    var L = SiteLoader, D = L.WebData;

    L.fillTexts({
      '#portalBadge': 'site.name',
      '#heroTitle': 'portal.heroTitle',
      '#heroSubtitle': 'portal.heroSubtitle'
    });
    document.title = D.get('site.name') + ' — 核技术医疗 · 企业综合服务';

    var subs = D.get('portal.subsidiaries') || [];
    var cardsHtml = '';
    subs.forEach(function(s){
      var highlightsHTML = (s.highlights||[]).map(function(h){ return '<li>'+h+'</li>'; }).join('');
      cardsHtml += '<article class="business-card '+(s.id==='atom'?'card-atom':'card-qg')+'">'+
        '<span class="card-tag">'+s.emoji+' '+(s.id==='atom'?'BNCT 医疗':'企业服务')+'</span>'+
        '<h3>'+s.name+'</h3><p>'+s.desc+'</p>'+
        (highlightsHTML?'<ul style="font-size:13px;color:rgba(255,255,255,0.55);margin:8px 0;padding-left:18px">'+highlightsHTML+'</ul>':'')+
        '<a href="'+s.link+'" class="card-link">进入官网 →</a></article>';
    });
    document.getElementById('subsidiaryCards').innerHTML = cardsHtml || '<p style="text-align:center;color:#889">暂无子品牌数据</p>';

    // 隐藏骨架屏，显示内容
    setTimeout(function(){
      if(loadingEl) loadingEl.classList.add('hidden');
      if(portalEl) portalEl.style.opacity = '1';
    }, 300);
  }
})();
</script>
</body>
</html>
